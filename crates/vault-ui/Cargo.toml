[package]
name = "vault-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vault-core = { path = "../vault-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tiny_http = "0.12"
include_dir = "0.7"
rand = "0.8"
hex = "0.4"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
ureq = { version = "2", features = ["json"] }
