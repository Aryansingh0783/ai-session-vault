<div class="stage" aria-hidden="true"></div>

<div class="shell">
  <aside class="sidebar" aria-label="Main navigation">
    <a class="brand" href="#/dashboard" aria-label="AI Session Vault">
      <img class="brand__mark" src="assets/logo.png" alt="" width="30" height="30">
      <span class="brand__name">Vault</span>
    </a>

    <nav class="ids-nav side-nav" aria-label="Primary">
      <a class="ids-nav__item" href="#/dashboard" data-route="dashboard" aria-label="Dashboard"><svg class="ids-icon"><use href="#i-dashboard"/></svg><span>Dashboard</span></a>
      <a class="ids-nav__item" href="#/projects" data-route="projects" aria-label="Projects"><svg class="ids-icon"><use href="#i-docs"/></svg><span>Projects</span></a>
      <a class="ids-nav__item" href="#/devices" data-route="devices" aria-label="Devices"><svg class="ids-icon"><use href="#i-laptop"/></svg><span>Devices</span></a>
      <a class="ids-nav__item" href="#/archive" data-route="archive" aria-label="Archive"><svg class="ids-icon"><use href="#i-archive"/></svg><span>Archive</span></a>
      <a class="ids-nav__item" href="#/health" data-route="health" aria-label="Health"><svg class="ids-icon"><use href="#i-shield"/></svg><span>Health</span></a>
    </nav>

    <p class="side-label">Synced tools</p>
    <ul class="side-list">
      <li data-tool="claude_code"><svg class="ids-icon"><use href="#i-terminal"/></svg><span>Claude Code</span><small></small></li>
      <li data-tool="codex"><svg class="ids-icon"><use href="#i-code"/></svg><span>Codex</span><small></small></li>
      <li data-tool="claude_desktop"><svg class="ids-icon"><use href="#i-monitor"/></svg><span>Claude Desktop</span><small></small></li>
    </ul>

    <p class="side-label">This device</p>
    <div class="side-device">
      <span class="team-dot" id="side-dot"></span>
      <div><b id="side-device-name">&mdash;</b><small id="side-device-state">starting&hellip;</small></div>
    </div>

    <a class="side-settings ids-nav__item" href="#/settings" data-route="settings" aria-label="Settings"><svg class="ids-icon"><use href="#i-settings"/></svg><span>Settings</span></a>
  </aside>

  <section class="main">
    <header class="topbar">
      <div>
        <h1 class="greeting" id="greeting">Hi!</h1>
        <p class="subline" id="subline">&nbsp;</p>
      </div>
      <div class="top-actions">
        <button class="ids-btn ids-btn--dark ids-btn--lg" id="btn-sync" data-action="sync"><svg class="ids-icon ids-icon--xs"><use href="#i-refresh"/></svg><span>Sync now</span></button>
        <a class="ids-iconbtn" href="#/archive" aria-label="Search sessions"><svg class="ids-icon"><use href="#i-search"/></svg></a>
        <button class="ids-iconbtn" id="btn-bell" data-action="activity" aria-label="Recent activity"><svg class="ids-icon"><use href="#i-bell"/></svg><span class="bell-dot" id="bell-dot" hidden></span></button>
        <span class="avatar" id="avatar" aria-hidden="true">A</span>
      </div>
    </header>
    <div id="page" class="page" tabindex="-1"></div>
  </section>
</div>

<div id="modal-root"></div>
<div class="ids-toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
