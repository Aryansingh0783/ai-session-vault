name: Release

# Push a tag like v2.0.0 to build binaries and attach them to a GitHub Release.
on:
  push:
    tags: ["v*"]
  # Run by hand to build and test everything without publishing a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            window: true
          - os: macos-latest
            name: macos-arm64
            window: true
          - os: ubuntu-latest
            name: linux-x64
            window: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries (keychain)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.window }}" = "true" ]; then
            cargo build --release --workspace
          else
            cargo build --release -p vault-cli
          fi
      - name: Package
        shell: bash
        run: |
          mkdir dist
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          cp "target/release/avault$ext" dist/
          if [ "${{ matrix.window }}" = "true" ]; then cp "target/release/avault-window$ext" dist/; fi
          cp README.md dist/ && cp docs/GUIDE.md dist/GUIDE.md
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "avault-${{ github.ref_name }}-${{ matrix.name }}.zip" ./dist/*
          else
            tar -czf "avault-${{ github.ref_name }}-${{ matrix.name }}.tar.gz" -C dist .
          fi
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" "/DAppVersion=$v" "/DSourceDir=$PWD/target/release" installer/avault.iss
          if ($LASTEXITCODE -ne 0) { throw 'the installer did not build' }
          Get-ChildItem dist-installer
      - name: Smoke test the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist-installer/AI-Session-Vault-Setup-*.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'avault-install'
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOICONS', "/DIR=$dir", '/LOG=install.log' -Wait
          if (-not (Test-Path "$dir/avault-window.exe")) { Get-Content install.log -ErrorAction SilentlyContinue; throw 'the installer did not install the app' }
          ./installer/smoke.ps1 -Dir $dir
      - uses: actions/upload-artifact@v4
        with:
          name: avault-${{ matrix.name }}
          path: |
            avault-*.zip
            avault-*.tar.gz
            dist-installer/*.exe

  # Publish only when every platform built and the Windows installer passed its smoke test.
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - run: ls -R assets
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/**
          generate_release_notes: true
