name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries (keychain)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # The native window crate needs a webview toolkit on Linux; it is built on Windows and macOS only.
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: cargo test --workspace --exclude vault-window
      - name: Test
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set +e
          cargo test --workspace 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          # surface failures as annotations (job logs need a login to read)
          grep -E "panicked at|^test .* FAILED|error(\[E[0-9]+\])?:" -A2 test.log | head -40 | while IFS= read -r l; do echo "::error::${l}"; done
          exit $code
