name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries (keychain)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # The native window crate needs a webview toolkit on Linux; it is built on Windows and macOS only.
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: cargo test --workspace --exclude vault-window
      - name: Test
        if: runner.os != 'Linux'
        run: cargo test --workspace
